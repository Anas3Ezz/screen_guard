name: screen_guard
description: A Flutter plugin to prevent screenshots and screen recording on Android and iOS. Uses FLAG_SECURE on Android and the UITextField secure layer trick on iOS.
version: 0.0.4
repository: https://github.com/Anas3Ezz/screen_guard
issue_tracker: https://github.com/Anas3Ezz/screen_guard/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.3.0"

flutter:
  plugin:
    platforms:
      android:
        package: dev.anasezz.screen_guard
        pluginClass: ScreenGuardPlugin
      ios:
        pluginClass: ScreenGuardPlugin

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
